<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<title>RayLee — The workspace your agents inherit</title>
<meta name="description" content="RayLee is a project workspace where your timeline and artifacts accumulate, and AI agents continue from that context — including while you’re away.">
<style>
:root, [data-theme="dark"] {
  --bg: #0E0E0C;
  --bg-2: #141412;
  --elev: #191917;
  --hover: #22221E;

  --accent: #E23C24;
  --accent-2: #FF6B55;
  --accent-soft: rgba(226,60,36,.16);
  --ok: #4ABA7A;
  --ok-bg: rgba(74,186,122,.14);
  --run: #7EB0E0;

  --wait: #E0B05A;

}
[data-theme="light"] {

  --bg-2: #E9E6DE;
  --elev: #FFFFFF;
  --hover: #F6F4EE;
  --ink: #141413;
  --ink-2: #3B3A36;
  --muted: #6B6962;
  --faint: #9A978E;
  --line: rgba(20,20,19,.09);
  --line-2: rgba(20,20,19,.15);
  --accent: #D43820;
  --accent-2: #C4301A;
  --accent-soft: rgba(212,56,32,.1);
  --ok: #1F7A4C;
  --ok-bg: rgba(31,122,76,.1);
  --run: #1A5F9E;
  --run-bg: rgba(26,95,158,.1);
  --wait: #8F5E0A;
  --wait-bg: rgba(143,94,10,.1);
  --shadow: 0 1px 2px rgba(20,20,19,.05), 0 16px 48px rgba(20,20,19,.1);
  --shadow-sm: 0 1px 2px rgba(20,20,19,.05), 0 6px 16px rgba(20,20,19,.06);
  --sidebar: #161615;
  --sb-t: #EDEBE6;
  --sb-m: #9A978E;
  --input-bg: #fff;
  --kbd-bg: #ECE9E1;
  --overlay: rgba(20,20,19,.4);
  --toast-bg: #141413;
  --toast-ink: #F3F1EB;
  --selection: rgba(212,56,32,.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { background: var(--bg); color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 13.5px;
  line-height: 1.5;
  letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--selection); }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }
kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 4px; background: var(--kbd-bg);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 10.5px; font-weight: 550; color: var(--muted);
  border: 1px solid var(--line-2);
}

.app { display: flex; min-height: 100%; }
.sidebar {
  width: 244px; flex-shrink: 0;
  background: var(--sidebar);
  color: var(--sb-t);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; z-index: 40;
  border-right: 1px solid rgba(255,255,255,.05);
}
.brand {
  display: flex; align-items: baseline; gap: 0;
  padding: 22px 20px 4px;
  font-weight: 650; font-size: 17px;
  letter-spacing: -.04em;
}
.brand .dot { color: var(--accent); }
.tagline {
  padding: 0 20px 18px;
  font-size: 11.5px; color: var(--sb-m);
  letter-spacing: -.005em; line-height: 1.45;
  font-weight: 450;
}
.nav { display: flex; flex-direction: column; gap: 1px; padding: 0 10px; flex: 1; overflow: auto; }
.nav a, .nav button.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 7px;
  color: var(--sb-m); width: 100%; text-align: left; font-size: 13px;

}
.nav a:hover, .nav button.nav-item:hover { background: rgba(255,255,255,.05); color: #F3F1EB; }

.nav svg { width: 15px; height: 15px; flex-shrink: 0; opacity: .85; }
.nav-sec { margin: 16px 10px 5px; font-size: 10px; color: var(--sb-m); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.nav-badge {
  margin-left: auto; background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 700; min-width: 17px; height: 17px;
  border-radius: 99px; display: inline-grid; place-items: center; padding: 0 5px;
}
.sb-cmd {
  margin: 4px 12px 10px;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px;

  border: 1px solid rgba(255,255,255,.06);
  color: var(--sb-m); font-size: 12.5px; width: calc(100% - 24px);
}
.sb-cmd:hover { background: rgba(255,255,255,.07); color: #fff; }
.sb-cmd span { flex: 1; text-align: left; }
.sb-foot { padding: 10px 10px 12px; border-top: 1px solid rgba(255,255,255,.06); }
.sb-user { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; color: #EDEBE6; }
.sb-user:hover { background: rgba(255,255,255,.05); }
.sb-user .meta { font-size: 11px; color: var(--sb-m); }

.mainwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  height: 52px; display: flex; align-items: center; gap: 12px;
  padding: 0 28px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 13.5px; font-weight: 600; letter-spacing: -.02em; flex: 1; min-width: 0; }
.topbar .crumb { color: var(--muted); font-weight: 450; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 7px;
  display: grid; place-items: center; color: var(--ink-2); position: relative;
  transition: background .12s;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn .dot {
  position: absolute; top: 5px; right: 5px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg);
}
.menu-btn { display: none; }
.content { padding: 28px 32px 80px; max-width: 1120px; width: 100%; }
.content.wide { max-width: 1280px; }
.page-enter { animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.banner {
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12.5px; color: var(--muted);
  margin-bottom: 24px;
  display: flex; gap: 10px; align-items: center;
}
.banner strong { color: var(--ink-2); font-weight: 600; }
.banner p { flex: 1; min-width: 0; margin: 0; }
.banner button { margin-left: 8px; flex-shrink: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
.banner button:hover { color: var(--ink); }

.hello { margin-bottom: 22px; }
.hello .greet { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.hello h2 { font-size: 26px; font-weight: 620; letter-spacing: -.038em; line-height: 1.2; }
.hello .prop { margin-top: 6px; color: var(--muted); font-size: 14px; letter-spacing: -.015em; }

.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
.metric {
  background: var(--elev); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px;
  transition: border-color .15s;
}
.metric:hover { border-color: var(--line-2); }
.metric .lbl { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; font-weight: 550; }
.metric .val { font-size: 21px; font-weight: 640; letter-spacing: -.04em; line-height: 1.15; }
.metric .sub { font-size: 11.5px; color: var(--faint); margin-top: 5px; }

.grid-2 { display: grid; grid-template-columns: 1.45fr .95fr; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.card-hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
.card-hd h2 { font-size: 12.5px; font-weight: 650; flex: 1; letter-spacing: -.01em; }
.card-bd { padding: 14px 18px 18px; }
.card-ft { padding: 10px 18px 14px; border-top: 1px solid var(--line); font-size: 12.5px; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px; border-radius: 99px;
  font-size: 11px; font-weight: 600; background: var(--bg-2); color: var(--ink-2);
  white-space: nowrap; letter-spacing: -.01em;
}
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.run { background: var(--run-bg); color: var(--run); }
.pill.wait { background: var(--wait-bg); color: var(--wait); }
.pill.muted { background: var(--bg-2); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent-2); }
.pill.sample { background: var(--bg-2); color: var(--muted); font-weight: 550; letter-spacing: .02em; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 7px;
  font-size: 12.5px; font-weight: 600; letter-spacing: -.01em;
  background: var(--ink); color: var(--bg);
  border: 1px solid transparent;
  transition: transform .12s, opacity .12s, background .12s;
}
.btn:hover { opacity: .9; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--hover); opacity: 1; }
.btn.soft { background: var(--bg-2); color: var(--ink); }
.btn.soft:hover { background: var(--hover); opacity: 1; }
.btn.danger { background: transparent; color: var(--accent); border: 1px solid var(--accent-soft); }
.btn.danger:hover { background: var(--accent-soft); opacity: 1; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.block { width: 100%; }

.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.strong { font-weight: 600; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }

.list-item { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: flex-start; }
.list-item:first-child { border-top: 0; padding-top: 2px; }
.list-item .body { flex: 1; min-width: 0; }
.list-item .title { font-weight: 600; font-size: 13px; letter-spacing: -.015em; }
.list-item .desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.list-item a.title:hover { text-decoration: underline; text-underline-offset: 2px; }

.proj-card { display: block; padding: 16px 18px; border-bottom: 1px solid var(--line); transition: background .12s; }
.proj-card:last-child { border-bottom: 0; }
.proj-card:hover { background: var(--hover); }
.proj-card h3 { font-size: 14px; font-weight: 630; letter-spacing: -.02em; }
.proj-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.proj-name-row h3 { margin: 0; }

.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 1px; background: var(--line-2); }
.tl-item { position: relative; padding: 0 0 22px 8px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: ""; position: absolute; left: -16px; top: 7px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--elev); border: 2px solid var(--ink);
}
.tl-item.agent::before { border-color: var(--run); background: var(--run-bg); }
.tl-item.branch::before { border-color: var(--accent); background: var(--accent-soft); }
.tl-when { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tl-what { font-size: 13.5px; letter-spacing: -.012em; }
.tl-moved {
  margin-top: 7px; font-size: 12.5px; color: var(--ink-2);
  background: var(--bg); border-radius: 7px; padding: 7px 10px;
  border: 1px solid var(--line);
}
.tl-moved span { color: var(--muted); margin-right: 6px; font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
.tl-meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }

.branch-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: var(--bg); }
.branch-flow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.branch-flow .box { background: var(--elev); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; font-size: 12.5px; max-width: 280px; }
.branch-flow .box.to { border-color: var(--ink-2); font-weight: 600; }
.branch-flow .arrow { color: var(--muted); }

.form-grid { display: grid; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.field input[type="text"], .field input[type="search"], .field input[type="datetime-local"],
.field input[type="number"], .field textarea, .field select,
input[type="text"], input[type="search"] {
  border: 1px solid var(--line-2); background: var(--input-bg);
  border-radius: 8px; padding: 8px 10px; min-height: 34px; color: var(--ink);
}
.field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus,
input[type="text"]:focus, input[type="search"]:focus {
  outline: none; border-color: var(--ink-2);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent);
}
.check { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
.check input { margin-top: 3px; accent-color: var(--accent); }

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 11px; font-weight: 620; color: var(--muted);
  padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
  letter-spacing: .03em; text-transform: uppercase;
}
table.data td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr:hover td { background: var(--hover); }

.usage { height: 6px; background: var(--bg-2); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.usage > span { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .4s ease; }
.usage.warn > span { background: var(--wait); }
.usage.full > span { background: var(--accent); }

.av { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; letter-spacing: -.02em; }
.av.lg { width: 68px; height: 68px; font-size: 24px; }
.av.sm { width: 22px; height: 22px; font-size: 10px; }
.model-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.agent-job { padding: 14px 0; border-top: 1px solid var(--line); }
.agent-job:first-child { border-top: 0; padding-top: 0; }
.agent-job h3 { font-size: 13.5px; font-weight: 630; letter-spacing: -.015em; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--run); box-shadow: 0 0 0 0 rgba(126,176,224,.5); animation: pulse 1.6s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(126,176,224,.45); }
  70% { box-shadow: 0 0 0 8px rgba(126,176,224,0); }
  100% { box-shadow: 0 0 0 0 rgba(126,176,224,0); }
}
.progress-ind { height: 2px; background: var(--bg-2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progress-ind > span { display: block; height: 100%; width: 40%; background: var(--run); animation: indet 1.4s ease-in-out infinite; }
@keyframes indet { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

.feed-item { background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 12px; margin-bottom: 10px; transition: border-color .15s; }
.feed-item:hover { border-color: var(--line-2); }
.feed-head { display: flex; gap: 12px; align-items: flex-start; }
.feed-head .who { font-weight: 640; letter-spacing: -.015em; }
.feed-head .who:hover { text-decoration: underline; text-underline-offset: 2px; }
.feed-body { margin: 10px 0 8px 44px; }
.feed-body p { font-size: 14px; letter-spacing: -.012em; }
.feed-acts { margin-left: 44px; display: flex; gap: 4px; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 8px; }
.react-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 6px; font-size: 12.5px; color: var(--muted); font-weight: 550; transition: background .12s, color .12s, transform .15s; }
.react-btn:hover { background: var(--hover); color: var(--ink); }
.react-btn.on { color: var(--accent); }
.react-btn.on svg { fill: currentColor; }
.react-btn.pop { animation: pop .28s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.comments { margin: 10px 0 4px 44px; }
.comment { display: flex; gap: 8px; padding: 8px 0; font-size: 13px; }
.comment .c-body { background: var(--bg); border-radius: 8px; padding: 8px 10px; flex: 1; border: 1px solid var(--line); }
.comment-form { display: flex; gap: 8px; margin-top: 6px; align-items: flex-start; }
.comment-form input[type="text"] { flex: 1; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-height: 34px; background: var(--input-bg); }

.profile-hd { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
.profile-hd h2 { font-size: 24px; font-weight: 640; letter-spacing: -.035em; }
.counts { display: flex; gap: 18px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.counts strong { font-weight: 650; color: var(--ink); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs button { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; letter-spacing: -.01em; }
.tabs button.active { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button:hover { color: var(--ink); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  height: 26px; padding: 0 10px; border-radius: 99px;
  border: 1px solid var(--line-2); background: transparent;
  font-size: 12.5px; font-weight: 550; color: var(--ink-2);
  transition: background .12s, color .12s, border-color .12s;
}
.chip:hover { background: var(--hover); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.map-canvas { background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 16px 8px 8px; overflow-x: auto; }

    var tMin = Math.min.apply(null, times);
    var tMax = Math.max.apply(null, times);
    if (tMax === tMin) tMax = tMin + 86400000 * 30;
    var padL = 176, padR = 24, padT = 28, rowH = 72;
    var innerW = 860;
    var w = padL + innerW + padR;
    var h = padT + projects.length * rowH + 36;
    var xOf = function (iso) { return padL + ((new Date(iso).getTime() - tMin) / (tMax - tMin)) * innerW; };
    var colors = isOwn ? ["#EDEBE6", "#7EB0E0", "#4ABA7A"] : ["#C98996", "#7BA89A", "#C4B08A", "#8A8AB5"];
    if (getTheme() === "light") colors = isOwn ? ["#141413", "#1A5F9E", "#1F7A4C"] : ["#6B3F4F", "#2F4A43", "#4A3F2F", "#3A3A55"];
    var months = [];
    var cur = new Date(new Date(tMin).getFullYear(), new Date(tMin).getMonth(), 1);
    var end = new Date(tMax);
    while (cur <= end) { months.push(new Date(cur)); cur.setMonth(cur.getMonth() + 1); }
    var monthLines = months.map(function (d) {

    }).join("");
    var ink = getTheme() === "light" ? "#141413" : "#F3F1EB";
    var mut = getTheme() === "light" ? "#6B6962" : "#8F8C83";

        .sort(function (a, b) { return new Date(a.at) - new Date(b.at); });

      var owner = userBy(p.ownerId);

          '<circle cx="' + x + '" cy="' + (y - 22) + '" r="3.5" fill="#E23C24"/>' +
          '<text x="' + (x + 24) + '" y="' + (y - 19) + '" font-size="9" fill="#E23C24">branch</text>';

      var dots = pts.map(function (pt) {

        return '<circle cx="' + pt.x + '" cy="' + y + '" r="5.5" fill="' + fill + '" stroke="' + col + '" stroke-width="2" style="cursor:pointer" data-action="map-tip" data-id="' + pt.a.id + '">' +

      var nm = p.name.length > 22 ? p.name.slice(0, 22) + "…" : p.name;
      var label = '<text x="8" y="' + (y - 8) + '" font-size="11" font-weight="600" fill="' + ink + '">' + esc(nm) + "</text>" +

      (isOwn ? "" : '<span class="pill sample">Sample people, public work</span>') + "</div>" +

  function addAssetFromForm(form) {

  function requestAgent(form) {

    var model = form.model.value;
    if (!state.modelsConnected[model]) { toast("That model isn’t connected."); return; }
    var job = {
      id: uid("ag"), projectId: form.projectId.value, title: (form.title.value || "").trim(),
      model: model, status: "queued", request: (form.request.value || "").trim(), result: "",

  function completeJob(job) {

    var p = projectBy(job.projectId);
    var vis = job.visibility || (p && p.visibility) || "private";
    if (p && visRank(vis) > visRank(p.visibility)) vis = p.visibility;
    var ast = {
      id: uid("ast"), projectId: job.projectId, ownerId: SELF,
      name: "Result: " + job.title, type: "Deliverable",
      provenance: "Agent (" + mname + ") produced this on " + fmtDT(job.completedAt) + ", at David Chen’s request.",
      verified: false, visibility: vis, createdAt: job.completedAt, sample: false, model: job.model
    };
    state.assets.unshift(ast);

      id: uid("act"), projectId: job.projectId, ownerId: SELF, at: job.completedAt,
      what: "Agent (" + mname + ") finished “" + job.title + ".”",

  function progressAgents() {
    var now = Date.now();
    var changed = false;
    state.agents.forEach(function (job) {
      if (!job.autoProgress) return;
      var st = normalizeStatus(job.status);
      if (st === "queued") {
        if (now - new Date(job.requestedAt).getTime() >= 2000) {
          job.status = "running"; job.startedAt = nowISO(); changed = true;
        }
      } else if (st === "running") {
        if (job.startedAt && now - new Date(job.startedAt).getTime() >= 5000) {
          completeJob(job); changed = true;
        }
      }
    });
    if (changed) { save(); safeRender(); }
    return changed;
  }

  var SIM_COMMENTS = [
    "The way this is recorded will be easy to come back to.",
    "Having the “now” state written down makes the next step clearer.",
    "I stalled in a similar place — useful to see how you moved.",
    "Glad the in-between is on the record, not just the finish.",

  ];
  function otherUsers() { return state.users.filter(function (u) { return u.id !== SELF; }); }
  function scheduleReaction(activityId) {
    setTimeout(function () { simulateReaction(activityId); }, 5000 + Math.floor(Math.random() * 4000));
  }
  function simulateReaction(activityId) {
    var act = activityBy(activityId);
    if (!act) return;
    var ev = effectiveVis(projectBy(act.projectId), act);
    if (ev === "private") return;
    var cands = otherUsers().filter(function (u) {
      if (ev === "followers" && !isFollowing(u.id, SELF)) return false;
      return true;
    });
    if (!cands.length) return;
    var u = cands[Math.floor(Math.random() * cands.length)];
    var did = false;
    if (!state.likes.some(function (l) { return l.activityId === activityId && l.userId === u.id; })) {
      state.likes.push({ id: uid("lk"), activityId: activityId, userId: u.id, at: nowISO(), sample: true, simulated: true });
      addNotification({ type: "like", fromUserId: u.id, activityId: activityId, text: u.name + " liked your activity." });
      did = true;
    }
    if (!state.comments.some(function (c) { return c.activityId === activityId && c.userId === u.id; }) && Math.random() < 0.7) {
      var body = SIM_COMMENTS[Math.floor(Math.random() * SIM_COMMENTS.length)];
      state.comments.push({ id: uid("cm"), activityId: activityId, userId: u.id, body: body, at: nowISO(), sample: true, simulated: true });
      addNotification({ type: "comment", fromUserId: u.id, activityId: activityId, text: u.name + " commented on your activity." });
      did = true;
    }
    if (did) {
      state.sim.reactionsScheduled = (state.sim.reactionsScheduled || 0) + 1;
      state.sim.lastAt = nowISO();
      save();
      safeRender();
      toast(u.name + " responded (sample).");
    }
  }
  function occasionalSim() {
    if ((state.sim.reactionsScheduled || 0) >= 4) return;
    if (state.sim.lastAt && Date.now() - new Date(state.sim.lastAt).getTime() < 20000) return;
    var publicMine = state.activities.filter(function (a) {
      if (a.ownerId !== SELF) return false;
      var ev = effectiveVis(projectBy(a.projectId), a);
      return ev === "public" || ev === "followers";
    });
    var options = [];
    publicMine.forEach(function (a) {
      otherUsers().forEach(function (u) {
        if (!state.likes.some(function (l) { return l.activityId === a.id && l.userId === u.id; })) options.push(a.id);
      });
    });
    if (!options.length) return;
    if (Math.random() < 0.35) simulateReaction(options[Math.floor(Math.random() * options.length)]);
  }

  function toggleLike(actId) {
    var act = activityBy(actId);
    if (!act || !canViewActivity(act)) return;
    var i = -1;
    state.likes.forEach(function (l, idx) { if (l.activityId === actId && l.userId === SELF) i = idx; });
    if (i >= 0) state.likes.splice(i, 1);
    else state.likes.push({ id: uid("lk"), activityId: actId, userId: SELF, at: nowISO() });
    save();
    render();
  }
  function addComment(actId, body) {

    if (!body) return;
    var act = activityBy(actId);
    if (!act || !canViewActivity(act)) return;
    state.comments.push({ id: uid("cm"), activityId: actId, userId: SELF, body: body, at: nowISO() });

  function runCmd(item) {

  function openCmd() {

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (ui.notifOpen && !t.closest(".notif-wrap") && !t.closest("[data-action=toggle-notif]")) {
      ui.notifOpen = false;
      if (!t.closest("[data-action]")) { render(); }

      ui.mapTip = circle.getAttribute("data-id");
      render();
      return;
    }
    var btn = t.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");
    if (action === "toggle-menu") { e.preventDefault(); ui.menuOpen = !ui.menuOpen; render(); return; }
    if (action === "close-menu") { ui.menuOpen = false; render(); return; }
    if (action === "toggle-notif") { e.preventDefault(); e.stopPropagation(); ui.notifOpen = !ui.notifOpen; render(); return; }
    if (action === "read-all-notif") { e.preventDefault(); state.notifications.forEach(function (n) { n.read = true; }); save(); render(); return; }
    if (action === "read-notif") {
      var n = state.notifications.filter(function (x) { return x.id === id; })[0];
      if (n) n.read = true;
      ui.notifOpen = false;
      save();
      return;
    }
    if (action === "open-activity") { e.preventDefault(); ui.modal = { type: "activity", projectId: btn.getAttribute("data-project") }; render(); return; }
    if (action === "open-project-new") { e.preventDefault(); ui.modal = { type: "project" }; render(); return; }
    if (action === "open-asset") { e.preventDefault(); ui.modal = { type: "asset" }; render(); return; }
    if (action === "close-modal") { e.preventDefault(); closeModal(); return; }
    if (action === "backdrop-modal") { if (t.classList.contains("modal-bg")) closeModal(); return; }
    if (action === "set-active") { e.preventDefault(); state.workspace.activeProjectId = id; save(); toast("Active project updated."); render(); return; }
    if (action === "edit-vis") { e.preventDefault(); ui.modal = { type: "vis", kind: "activity", id: id }; render(); return; }
    if (action === "edit-proj-vis") { e.preventDefault(); ui.modal = { type: "vis", kind: "project", id: id }; render(); return; }
    if (action === "agent-filter") { ui.agentFilter = btn.getAttribute("data-key"); render(); return; }
    if (action === "asset-type") { ui.assetType = btn.getAttribute("data-key"); render(); return; }
    if (action === "asset-proj") { ui.assetProj = btn.getAttribute("data-key"); render(); return; }
    if (action === "asset-ver") {
      var k = btn.getAttribute("data-key");

      render();
      return;
    }
    if (action === "feed-filter") { ui.feedFilter = btn.getAttribute("data-key"); render(); return; }
    if (action === "profile-tab") { ui.profileTab = btn.getAttribute("data-key"); render(); return; }
    if (action === "like") { e.preventDefault(); toggleLike(id); return; }
    if (action === "toggle-comments") { e.preventDefault(); ui.commentsOpen[id] = !ui.commentsOpen[id]; render(); return; }
    if (action === "follow") { e.preventDefault(); followUser(id); return; }

    if (action === "open-shortcuts") { e.preventDefault(); ui.shortcutsOpen = true; ui.cmdOpen = false; render(); return; }
    if (action === "close-shortcuts") { e.preventDefault(); ui.shortcutsOpen = false; render(); return; }
    if (action === "dismiss-banner") { e.preventDefault(); state.workspace.bannerDismissed = true; ui.bannerDismissed = true; save(); render(); return; }
    if (action === "onb-next") { e.preventDefault(); ui.onbStep = (ui.onbStep || 0) + 1; render(); return; }
    if (action === "onb-back") { e.preventDefault(); ui.onbStep = Math.max(0, (ui.onbStep || 0) - 1); render(); return; }

      if (!on && count < 1) { t.checked = true; toast("Keep at least one model connected."); return; }

  document.addEventListener("submit", function (e) {
    var form = e.target;

  document.addEventListener("keydown", function (e) {
    var meta = e.metaKey || e.ctrlKey;
    var inField = e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT" || e.target.isContentEditable);
    if (meta && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      if (ui.cmdOpen) { ui.cmdOpen = false; render(); }
      else openCmd();
      return;
    }
    if (ui.cmdOpen) {
      if (e.key === "Escape") { e.preventDefault(); ui.cmdOpen = false; render(); return; }
      if (e.key === "ArrowDown") { e.preventDefault(); ui.cmdIndex = Math.min(ui.cmdItems.length - 1, ui.cmdIndex + 1); render(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); ui.cmdIndex = Math.max(0, ui.cmdIndex - 1); render(); return; }
      if (e.key === "Enter") { e.preventDefault(); runCmd(ui.cmdItems[ui.cmdIndex]); return; }
      return;
    }
    if (e.key === "Escape") {
      if (ui.modal || ui.shortcutsOpen) { closeModal(); return; }
      if (ui.notifOpen) { ui.notifOpen = false; render(); return; }
      if (ui.menuOpen) { ui.menuOpen = false; render(); }
      return;
    }
    if (inField) return;
    if (!state || !state.workspace || !state.workspace.onboarded) return;
    if (e.key === "?" ) { e.preventDefault(); ui.shortcutsOpen = !ui.shortcutsOpen; render(); return; }
    if (e.key === "t" || e.key === "T") { e.preventDefault(); toggleTheme(); return; }
    if (e.key === "n" || e.key === "N") { e.preventDefault(); navTo("#/agents"); return; }
    if (e.key === "c" || e.key === "C") {
      e.preventDefault();
      var r = route();
      var pid = (r.name === "projects" && r.id) ? r.id : (state.workspace.activeProjectId || (ownProjects()[0] && ownProjects()[0].id));
      if (pid) { ui.modal = { type: "activity", projectId: pid }; render(); }
      return;
    }
    if (ui.goChord) {
      ui.goChord = false;
      var map = { h: "#/home", H: "#/home", f: "#/feed", F: "#/feed", p: "#/projects", P: "#/projects", a: "#/agents", A: "#/agents", l: "#/library", L: "#/library", m: "#/map", M: "#/map", k: "#/market", K: "#/market", b: "#/billing", B: "#/billing", s: "#/settings", S: "#/settings" };
      if (map[e.key]) { e.preventDefault(); navTo(map[e.key]); }
      return;
    }
    if (e.key === "g" || e.key === "G") {
      e.preventDefault();
      ui.goChord = true;
      setTimeout(function () { ui.goChord = false; }, 800);
    }
  });

  document.addEventListener("focusout", function () {
    if (ui.pendingRender) setTimeout(function () { if (!shouldDeferRender()) safeRender(); }, 0);
  });

  window.addEventListener("hashchange", function () {
    ui.menuOpen = false;
    ui.notifOpen = false;
    ui.modal = null;
    ui.cmdOpen = false;
    ui.shortcutsOpen = false;
    render();
    window.scrollTo(0, 0);
  });

  function init() {
    state = load();
    applyTheme(getTheme());
    var h = location.hash;
    if (!h || h === "#" || h === "#/") location.hash = "#/home";
    render();
    setInterval(function () { if (state) progressAgents(); }, 800);
    setInterval(function () { if (state && state.workspace.onboarded) occasionalSim(); }, 18000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
